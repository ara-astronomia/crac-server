# GPIO pins wired to switches must be set up as: GPIO.setup(pin, GPIO.IN, pull_up_down=GPIO.PUD_UP)
# where pin is the pin number in the chosen GPIO numbering, BOARD or BMC,
# GPIO.IN sets the pin as an input,
# and pull_up_down=GPIO.PUD_UP holds the pin high until the switch is pressed,
# which pulls it low by connecting it to ground.

# Two kinds of value live in this file, and they behave differently on a
# running server.
#
# Thresholds, limits and switches are read again every time a decision is
# taken, so editing them here takes effect within seconds, without a restart.
#
# Addresses, GPIO pins and the driver to load describe how a component is
# built. They are read once, while the component is created at startup, and a
# change needs a restart: the roof, the curtains and the telescope are not
# rebuilt while the observatory is running.
#
# Every section below says which of the two it is.

[server]
# Read at startup: a change needs a restart.
port = 50051
loopback_ip = [::]
# off drives the real GPIO of the observatory. The test stack turns it on with
# SERVER_GPIO_MOCK, so that a missing override here can only mean real hardware.
gpio_mock = off

[geography]
# Read on every use: editing takes effect without a restart.
# observing site latitude
lat = 42d13.76m
# observing site longitude
lon = +12d48.69m
# elevation above sea level
height = 465
# equinox
equinox = J2000

[telescope]
# Mixed: the keys marked below are read at startup, the rest on every use.
# one of simulator, indi, theskyx, ascom_hub - read at startup
driver = indigo
# hostname/ip address where the telescope server is running - read at startup
hostname = 192.168.0.27
# port where the server is listening
# theskyx 3040
# indi 7624
# ascom_hub 11111
# read at startup
port = 7624
# max secure telescope altitude for closing the roof
max_secure_alt = 10
# telescope altitude for parking
park_alt = 1
# telescope azimuth for parking
park_az = 359
# telescope altitude for flat - read at startup
flat_alt = 1.5
# telescope azimuth for flat - read at startup
flat_az = 358.5
# can put the telescope in tracking off mode (TelescopeSpeed.SPEED_NOT_TRACKING)
# read at startup
tracking_off = true
# interval between polling
polling_interval = 0.15

[indi]
# Read at startup: a change needs a restart.
# name of telescope
# default Telescope Simulator
# frasso Astro-Electronic FS-2
# frasso LX200 Classic
name = Telescope Simulator

[indigo]
# Read at startup: a change needs a restart.
# name of telescope
# default Telescope Simulator
# frasso Astro-Electronic FS-2
# frasso LX200 Classic
name = Mount Simulator

[cover_mirror]
# Read at startup: a change needs a restart.
device = RC Cover Simulator

[ccd_data_image]
# Read on every use: editing takes effect without a restart.
# field of view width, in arcminutes
field_of_view_width = 20
# field of view height, in arcminutes
field_of_view_height = 13.4

[ascom_hub]
# Read at startup: a change needs a restart.
# device number of the telescope 
# as it is configured on the 
# ascom remote server
device_number = 0

[motor_board]
# Read at startup: a change needs a restart.
# GPIO.BMC numbering: the numbers are pin numbers
# pin 31, east curtain motor signal
motorE_A = 6
# pin 33, east curtain motor signal
motorE_B = 13
# pin 29, east curtain motor enable
motorE_E = 5

# pin 38, west curtain motor signal
motorW_A = 20
# pin 40, west curtain motor signal
motorW_B = 21
# pin 36, west curtain motor enable
motorW_E = 16

# corsa and passo_cinghia are here in case a specific encoder hardware is used
# travel of the driving arm, in mm
corsa = 700
# pitch of the encoder toothed belt
passo_cinghia = 6

[encoder_board]
# Read at startup: a change needs a restart.
# GPIO.BMC numbering: the numbers are pin numbers on board
# pin 18, east curtain encoder clock
clk_e = 18
# pin 23, east curtain encoder dt
dt_e = 23
# pin 24, west curtain encoder clock
clk_w = 24
# pin 25, west curtain encoder dt
dt_w= 25

[roof_board]
# Read at startup: a change needs a restart.
# GPIO.BMC numbering
# pin 11, roof closed -- CHECK THE SWITCH STATE AGAINST THE CONFIGURED VALUE
roof_verify_closed = 27
# pin 7, roof open -- CHECK THE SWITCH STATE AGAINST THE CONFIGURED VALUE
roof_verify_open = 17
# pin 13, roof open/close command -- SAME PIN FOR OPEN AND CLOSED, ROOF_CONTROL SWITCHES IT FROM HIGH TO LOW
switch_roof = 4
# timeout before sending an error for blocked roof
roof_timeout = 50

[encoder_step]
# Read at startup, except n_step_corsa, which is read on every move.
n_step_sub_min = -10
# total steps for a full curtain travel
n_step_corsa = 205
# may be needed for motors without limit switches
n_step_sicurezza =  215
# tolerated deviation from the expected step count
tolerance_steps = 0

[azimut]
# Read on every use: editing takes effect without a restart.
# maximum curtain altitude and azimuth measured at the four corners
azNE = 20
azSE = 160
azSW = 190
azNW = 340

[tende]
# Read on every use: editing takes effect without a restart.
# maximum curtain height, as alt
max_est = 70
max_west = 70
# minimum height for closed curtains, as alt
park_est = 0
park_west = 0
# curtain mounting angle
alpha_min = -12

[curtains_limit_switch]
# Read at startup: a change needs a restart.
# checks not wired into the code yet, but possibly needed
# these keys check the curtain limit switches while opening and closing
# GPIO.BMC numbering
# pin 35, west curtain open limit switch
curtain_W_verify_open = 19
# pin 37, west curtain closed limit switch
curtain_W_verify_closed= 26
# pin 15, east curtain open limit switch
curtain_E_verify_open = 8
# pin 32, east curtain closed limit switch
curtain_E_verify_closed = 7

[panel_board]
# Read at startup: a change needs a restart.
# flat panel power control
# GPIO.BMC numbering
switch_panel = 10
switch_power = 9
switch_light = 22
switch_aux = 11

[weather]
# Read at startup, except block_on_unspecified, which is read on every check.
url = https://meteo.ara.roma.it/current.json
fallback_url = https://ara.roma.it/meteo/current.json
time_format = %%Y-%%m-%%d %%H:%%M:%%S
time_expired = 660
retry_interval = 330
# seconds before giving up on a weather source, spent once per source:
# a reading that falls back waits for this twice
url_timeout = 10
# Refuse to open roof and curtains when the weather is unknown, instead of
# assuming it is safe.
block_on_unspecified = true

[temperature]
# Read on every use: editing takes effect without a restart.
warning = 35
upper_bound = 40
lower_bound = -10

[wind_speed]
# Read on every use: editing takes effect without a restart.
lower_bound = 0
warning = 10
error = 36
upper_bound = 40

[wind_gust_speed]
# Read on every use: editing takes effect without a restart.
lower_bound = 0
warning = 10
error = 36
upper_bound = 150

[humidity]
# Read on every use: editing takes effect without a restart.
lower_bound = 0
warning = 85
error = 95
upper_bound = 100

[rain_rate]
# Read on every use: editing takes effect without a restart.
lower_bound = 0
warning = 1
error = 12
upper_bound = 15

[barometer]
# Read on every use: editing takes effect without a restart.
lower_bound = 980
error = 990
warning = 1005
upper_bound = 1045

[barometer_trend]
# Read on every use: editing takes effect without a restart.
lower_bound = -10
error = -5
warning = -3
upper_bound = 10

[ups]
# Read at startup, except ups_list, which is read on every request.
hostname=192.168.178.22
port = 3493
login=user
password=password
driver=nut
ups_list=apc-3000,cyberpower
time_expired=60

[ups_metrics]
# Read on every use: editing takes effect without a restart.
# our name = NUT/simulator attribute name. Being listed here is what makes
# a metric read: there is no other switch anywhere else
battery_charge = battery.charge
input_voltage = input.voltage

# current is not read from real hardware today (no known thresholds), so it
# is not listed above. Reference layout for when real thresholds are known
# (add "output_current = output.current" above in [ups_metrics] as well):
# [output_current.ok]
# lower_bound = 0
# upper_bound = 8
#
# [output_current.danger]
# lower_bound = 8
# upper_bound = 20

[input_voltage.danger_lower]
# Read on every use: editing takes effect without a restart.
lower_bound = 0
upper_bound = 209

[input_voltage.ok]
lower_bound = 209
upper_bound = 241.5

[input_voltage.danger_upper]
lower_bound = 241.5
upper_bound = 250

[battery_charge.ok]
# Read on every use: editing takes effect without a restart.
lower_bound = 50
upper_bound = 100

[battery_charge.warning]
lower_bound = 35
upper_bound = 50

[battery_charge.danger]
lower_bound = 0
upper_bound = 35

[apc-3000]
input.voltage=225.5
battery.charge=98
ups.status=OL

[cyberpower]
input.voltage=230.1
battery.charge=100
ups.status=OL

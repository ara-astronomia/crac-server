# Configuration the test suite runs on, chosen by tests/__init__.py.
# Hostnames and URLs are unroutable on purpose: a test that opens a connection
# has to fail, not reach the observatory. A test needing a specific value
# patches Config for itself, as the UPS ones do.

# GPIO pins wired to switches must be set up as: GPIO.setup(pin, GPIO.IN, pull_up_down=GPIO.PUD_UP)
# where pin is the pin number in the chosen GPIO numbering, BOARD or BMC,
# GPIO.IN sets the pin as an input,
# and pull_up_down=GPIO.PUD_UP holds the pin high until the switch is pressed,
# which pulls it low by connecting it to ground.

[server]
port = 50051
loopback_ip = [::]
gpio_mock = on

[geography]
# observing site latitude
lat = 42d13.76m
# observing site longitude
lon = +12d48.69m
# elevation above sea level
height = 465
# equinox
equinox = J2000

[telescope]
# name of a driver registered under the crac_server.telescope_drivers entry point
driver = indigo
# hostname/ip address where the telescope server is running
hostname = telescope.invalid
# port where the server is listening
# indigo 7624
port = 7624
# max secure telescope altitude for closing the roof
max_secure_alt = 10
# telescope altitude for parking
park_alt = 1
# telescope azimuth for parking
park_az = 359
# telescope altitude for flat
flat_alt = 1.5
# telescope azimuth for flat
flat_az = 358.5
# can put the telescope in tracking off mode (TelescopeSpeed.SPEED_NOT_TRACKING)
tracking_off = true
# interval between polling
polling_interval = 0.15
# seconds RA/DEC may stay still during a slew before the movement is reported
# as failed: a moving mount is waited for as long as it takes
slew_still_timeout = 30

[indigo]
# name of telescope
# default Telescope Simulator
# frasso Astro-Electronic FS-2
# frasso LX200 Classic
name = Mount Simulator

[cover_mirror]
device = RC Cover Simulator

[ccd_data_image]
# field of view width, in arcminutes
field_of_view_width = 20
# field of view height, in arcminutes
field_of_view_height = 13.4

[motor_board]
# GPIO.BMC numbering: the numbers are pin numbers
# pin 31, east curtain motor signal
motorE_A = 6
# pin 33, east curtain motor signal
motorE_B = 13
# pin 29, east curtain motor enable
motorE_E = 5

# pin 38, west curtain motor signal
motorW_A = 20
# pin 40, west curtain motor signal
motorW_B = 21
# pin 36, west curtain motor enable
motorW_E = 16
# seconds a curtain motor stays stopped before turning the other way
reverse_pause = 0.5

# corsa and passo_cinghia are here in case a specific encoder hardware is used
# travel of the driving arm, in mm
corsa = 700
# pitch of the encoder toothed belt
passo_cinghia = 6

[encoder_board]
# GPIO.BMC numbering: the numbers are pin numbers on board
# pin 18, east curtain encoder clock
clk_e = 18
# pin 23, east curtain encoder dt
dt_e = 23
# pin 24, west curtain encoder clock
clk_w = 24
# pin 25, west curtain encoder dt
dt_w= 25

[roof_board]
# GPIO.BMC numbering
# pin 11, roof closed -- CHECK THE SWITCH STATE AGAINST THE CONFIGURED VALUE
roof_verify_closed = 27
# pin 7, roof open -- CHECK THE SWITCH STATE AGAINST THE CONFIGURED VALUE
roof_verify_open = 17
# pin 13, roof open/close command -- SAME PIN FOR OPEN AND CLOSED, ROOF_CONTROL SWITCHES IT FROM HIGH TO LOW
switch_roof = 4
# timeout before sending an error for blocked roof
roof_timeout = 50

[encoder_step]
# total steps for a full curtain travel
n_step_corsa = 205
# an opening curtain stops here, and the encoder never counts beyond it
n_step_sicurezza =  215
# tolerated deviation from the expected step count
tolerance_steps = 0

[azimut]
# maximum curtain altitude and azimuth measured at the four corners
azNE = 20
azSE = 160
azSW = 190
azNW = 340

[tende]
# maximum curtain height, as alt
max_est = 70
max_west = 70
# minimum height for closed curtains, as alt
park_est = 0
park_west = 0
# curtain mounting angle
alpha_min = -12

[curtains_limit_switch]
# checks not wired into the code yet, but possibly needed
# these keys check the curtain limit switches while opening and closing
# GPIO.BMC numbering
# pin 35, west curtain open limit switch
curtain_W_verify_open = 19
# pin 37, west curtain closed limit switch
curtain_W_verify_closed= 26
# pin 15, east curtain open limit switch
curtain_E_verify_open = 8
# pin 32, east curtain closed limit switch
curtain_E_verify_closed = 7

[panel_board]
# flat panel power control
# GPIO.BMC numbering
switch_panel = 10
switch_power = 9
switch_light = 22
switch_aux = 11

[weather]
url = http://weather.invalid/current.json
fallback_url = http://weather-fallback.invalid/current.json
time_format = %%Y-%%m-%%d %%H:%%M:%%S
time_expired = 660
retry_interval = 330
# seconds before giving up on a weather source, spent once per source:
# a reading that falls back waits for this twice
url_timeout = 10
# Refuse to open roof and curtains when the weather is unknown, instead of
# assuming it is safe.
block_on_unspecified = true
# seconds between two weather checks run by the server itself: the
# emergency closure starts even when no client is asking for the weather.
# At least 30.
check_interval = 60

[emergency_closure]
park_timeout = 0.3
curtains_timeout = 0.3
max_reading_age = 0.3

[temperature]
scale = -10..40
warning = 35..

[wind_speed]
scale = 0..40
warning = 10..
danger = 36..

[wind_gust_speed]
scale = 0..150
warning = 10..
danger = 36..

[humidity]
scale = 0..100
warning = 85..
danger = 95..

[rain_rate]
scale = 0..15
warning = 1..
danger = 12..

[barometer]
scale = 980..1045
warning = ..1005
danger = ..990

[barometer_trend]
scale = -10..10
warning = ..-3
danger = ..-5

[ups]
hostname=ups.invalid
port = 3493
login=test
password=test
driver=nut
ups_list=apc-3000,cyberpower
time_expired=60
# how often the server reads the UPS on its own, so that the emergency
# closure does not wait for a client to ask
check_interval = 30

[ups_metrics]
# our name = NUT/simulator attribute name. Being listed here is what makes
# a metric read: there is no other switch anywhere else
battery_charge = battery.charge
input_voltage = input.voltage
ups_status = ups.status

# current is not read from real hardware today (no known thresholds), so it
# is not listed above. Reference layout for when real thresholds are known
# (add "output_current = output.current" above in [ups_metrics] as well):
# [output_current]
# scale = 0..20
# danger = 8..

[input_voltage]
# the mains voltage is a diagnostic of the power line, never a danger: the
# UPS absorbs it, what matters is the UPS switching to battery or the
# charge dropping
scale = 0..250
warning = ..209, 241.5..

[ups_emergency]
# seconds an UPS must stay on battery, or with a dangerous output current,
# before the emergency closure starts: a short mains glitch must not close
# the observatory on its own
critical_time = 300
# the closure starts at once when any UPS charge drops to this percentage
critical_battery_percentage = 60
# checks that can start the closure: battery_charge, ups_status,
# output_current. Only the listed ones are evaluated; input_voltage is
# never a check, it stays a warning on both sides
enabled_checks = battery_charge,ups_status
# refuse to open roof and curtains while the UPS status is not known
block_on_unspecified = true

[battery_charge]
scale = 0..100
warning = 35..50
danger = ..35

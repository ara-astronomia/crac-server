name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --no-dev
      # A hung suite is aborted after 5 minutes and faulthandler prints the
      # stack of every thread, so the log shows where it got stuck.
      - run: uv run timeout -s ABRT 300 python -X faulthandler -m unittest discover
